<div #menu class="fixed inset-0 z-999 flex flex-col overflow-hidden px-5 bg-header">

  <div class="flex items-center justify-between min-h-18 py-2">
    <span class="font-serif text-xl font-bold text-primary tracking-wide">Menú</span>
    <button (click)="onClose()" class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center text-primary transition-all duration-200 hover:bg-secondary/20 active:scale-90">
      <svg lucideX class="w-5 h-5"></svg>
    </button>
  </div>

  <div class="flex flex-col gap-4 flex-1 justify-start pt-5 pb-6">
    @for(link of linkCollection; track link.id) {
      <a [routerLink]="link.route" (click)="onClose()" class="flex flex-row items-center gap-4 w-full rounded-2xl border border-secondary/30 bg-white/60 backdrop-blur-sm p-3 transition-all duration-200 hover:border-secondary/60 hover:shadow-lg hover:-translate-y-0.5 active:scale-[0.98] no-underline">
        <div class="w-32 h-32 shrink-0 rounded-xl bg-[#f5ead8] overflow-hidden">
          <img [src]="link.image" [alt]="link.name" class="w-full h-full object-cover mix-blend-multiply" >
        </div>
        <div class="flex flex-col gap-0.5 flex-1 min-w-0">
          <span class="text-[0.65rem] font-semibold tracking-widest uppercase text-secondary">{{ link.tag }}</span>
          <span class="font-serif text-[1.25rem] font-bold text-primary leading-tight">{{ link.name }}</span>
          <span class="text-xs text-primary/55 mt-1 leading-snug">{{ link.description }}</span>
          <span class="text-xs font-semibold text-secondary mt-2">Ir al rincón →</span>
        </div>
      </a>
    }
  </div>

</div>
